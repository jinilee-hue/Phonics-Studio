name: Deploy to GitHub Pages

# 디자인 모드(목데이터)로 정적 빌드 후 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작한다.
on:
  push:
    branches: [feature/design]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      # SPA 라우팅 폴백 — 딥링크 새로고침 시 404 대신 index를 서빙
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
